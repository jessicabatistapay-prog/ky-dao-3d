# Dùng khi không chạy Caddy. Chứng chỉ lấy bằng certbot hoặc công cụ tương tự.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name kydao.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name kydao.example.com;

    ssl_certificate     /etc/letsencrypt/live/kydao.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/kydao.example.com/privkey.pem;

    # Không ghi query string để giữ log gọn; token phiên không đi qua URL.
    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 75s;
    }
}
